services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zesp}
      POSTGRES_USER: ${POSTGRES_USER:-zesp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zesp}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zesp}"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CHROMA_PATH: /data/chroma
      MEDIA_ROOT: /data/media
    volumes:
      - appdata:/data
      - ./backend:/app
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
  appdata:
